name: ci

# The Python gate: the locked environment, ruff (lint + format), mypy --strict over src/ (pyproject [tool.mypy]),
# and the full pytest suite on a pinned macOS image (the suite has macOS-only tests: st_flags, getattrlist,
# plutil, codesign, tmutil). Actions are pinned by full commit SHA: checkout as in diagrams.yml, setup-uv v10.2.0
# resolved with `gh api repos/astral-sh/setup-uv/git/ref/tags/v10.2.0` on 2026-09-29 (a lightweight tag on
# commit c18668a). ruff is scoped to src/ and tests/: the receipt experiments under docs/ are kept byte-for-byte,
# and the film scripts and the Python blocks inside the design docs are not held to it.
#
# CORRECTED (2026-10-05): a bare `push:` ran every branch, so a hand-off branch re-ran a commit main had already
# run and a same-repo pull request would have run twice. Pushes now run on main only; a branch gets its run from
# its pull request or from workflow_dispatch. `uv sync --locked` also installs the `lint` group, which puts the
# locked shellcheck on PATH, so the three shellcheck tests that used to skip on this image now run.
#
# pytest runs with `-n auto` (pytest-xdist, locked in the dev group): one worker per runner core. The same flag
# is in CLAUDE.md's gate list; change both together.
#
# timeout-minutes was 30 until B13 round 19 W80: the job took 23 to 24 minutes on the four green runs before it,
# and the same 5120 tests and source took 24:00 on one run and 20:59 on the next (pytest's step 23:32 and 20:23;
# 6e7ae244, fba3908a: docs and three test regexes apart), so the runner's own spread (about 3 minutes) and a
# round's new tests left too little margin. No test added in the jump was an outlier to cut. Round 19's jobs then
# took 20:59 to 24:46 (B13 round 20 X63). Round 20's ten jobs (34818253 to 20612f1f) took 21:17 to 26:13 but one,
# 33:53 (64380e08, pytest's step 33:14, with timing tests skipped at a load of 5 to 8 per core), 6 minutes under
# the limit of 40, so it is 45: 10 minutes above that job too (B13 round 21 Y68). CLAUDE.md gives the range.
# Round 21's seven jobs and round 22's first (eaed1034 to fcafd734) took 18:05 to 28:34, all green on attempt 1, so
# 45 stays 16 minutes above them (B13 round 22 Z67, Z88). Round 22's nine jobs (fcafd734 to 7a54f938) took 19:29
# to 31:21, all on attempt 1 (one red test, fixed by a96dfc7b), so 45 stays 13 minutes above them (B13 round 23
# A74, A93). Round 23's thirteen jobs (ed901cd3 to b1f4a087) took 24:34 to 32:18, all on attempt 1 (one red run,
# 39809607845 on 38727270, fixed by 46880b9e and 193c4e5d), so 45 stays 12 minutes above them (B13 round 24
# B98). Waits for a macOS runner reached 48 minutes (193c4e5d) and 46 (38727270); a wait is not counted against
# timeout-minutes. Round 24's ten jobs (c93fcd96 to 3ec66a92) took 30:06 to 36:24, all green on attempt 1, every
# one past 30 and three past 33 (pytest's step 35:46 at 5685 tests on the slowest, 58183bb5), which left 45 only
# 8:36 above them, and the slowest rose each round (31:21, 32:18, 36:24), so it is 50: 13 minutes above them
# (B13 round 25 D83). Round 27's eight jobs and round 28's first (f04c61db to d1f72d6f) took 26:53 to 40:01 but
# one, 49:59 (d1f72d6f, a docs-only commit; pytest's step 49:26 at 6050 tests), all green on attempt 1, five past
# 37, which left 50 one second above that job, so it is 60: 10 minutes above it (B13 round 28 I99).
# Round 28's six later jobs and round 29's first (71388552 to b2724d9c) took 30:19 to 44:27, all green on attempt 1
# (the slowest 3f1dee54, pytest's step 43:58 at 6191 tests), so 60 stays 15 minutes above them and 10 above
# 49:59 (B13 round 29 C207, C196).
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.17"
      - name: uv sync --locked
        run: uv sync --locked
      - name: ruff check
        run: uv run --locked ruff check src tests
      - name: ruff format --check
        run: uv run --locked ruff format --check src tests
      - name: mypy src
        run: uv run --locked mypy src
      - name: pytest
        run: uv run --locked pytest -q -p no:cacheprovider -n auto
