[project]
name = "agentsync"
version = "0.1.0"
description = "Keep an agent-readable docs/ git repo in sync with OneDrive, SharePoint, Outlook, Teams and local sync-client folders, processing only what changed."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "renchris" }]
classifiers = [
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
]
dependencies = [
  "openpyxl>=3.1,<4",
  "python-pptx>=1.0,<2",
  "pdfminer.six>=20240706",
  "pypandoc_binary>=1.13,<2",
  "msal[broker]>=1.31,<2",
  "msal-extensions>=1.2,<2",
  "httpx>=0.27,<1",
  "PyYAML>=6.0,<7",
  "truststore>=0.10.4",
  "pypdfium2>=5.13.0",
]

[project.scripts]
agentsync = "agentsync.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "respx>=0.21,<1",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML>=6.0",
  "types-openpyxl>=3.1",
]
# One shellcheck for the lint job, the shellcheck tests and the developer: the runner image ships 0.9.0 and
# Homebrew 0.11.0, and the two disagree on SC2015.
lint = ["shellcheck-py==0.11.0.1"]

[tool.uv]
default-groups = ["dev", "lint"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentsync"]

# `agentsync it-request` renders the IT request page; a wheel installed without its source checkout reads
# this copy (src/agentsync/it_request.py).
[tool.hatch.build.targets.wheel.force-include]
"docs/deploy/it-request.md" = "agentsync/_deploy/it-request.md"
"docs/deploy/entra-app.json" = "agentsync/_deploy/entra-app.json"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF", "PTH", "T20", "C4", "PIE", "RET", "PL",
  "D101", "D102", "D103",
]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004",
  "RET504",
]

[tool.ruff.lint.per-file-ignores]
"src/agentsync/cli.py" = ["T20"]
"tests/**" = ["D", "T20", "PLR", "S"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
files = ["src"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["msal", "msal.*", "msal_extensions", "msal_extensions.*", "pypandoc", "pypandoc.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra"
markers = [
  "macos: needs macOS-specific syscalls (st_flags, setiopolicy_np, getattrlist)",
  "network: talks to a real network service; never run by default",
  "fileprovider: touches the live OneDrive File Provider mount (agentsync-e2e/ only)",
]
